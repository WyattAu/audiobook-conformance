# Bespoke CI: this crate's manifest path-depends on estate siblings
# (../audiobook-core, ../id3-core, ../mp4-core), so the shared rust-kit
# workflow — which checks out one repository — cannot resolve them. This
# workflow checks the siblings out beside the caller (bootstrap.sh's layout
# for a human clone) and runs the gates here. The standards job calls the
# same rust-kit matrix with the siblings named, for the operator view.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check out the estate siblings the manifest path-depends on
        run: |
          for sibling in mp4-core id3-core audiobook-core cuesheet-core audiobook-shelf; do
            git clone --depth 1 "https://github.com/WyattAu/$sibling" "$GITHUB_WORKSPACE/../$sibling"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: ffmpeg — the corpus is generated with it
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update --quiet && sudo apt-get install --yes --quiet ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: conformance
        run: cargo run -- --root /tmp/audiobook-corpus

  standards:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      estate-siblings: "mp4-core id3-core audiobook-core cuesheet-core audiobook-shelf"
      tier: a
      all-features: true
      # The harness is a process surface (ADR-0005): its substance is
      # driving ffmpeg/ffprobe, which the line gate cannot see. The pure
      # comparison logic stays gated; the driver and the two adapter
      # modules are excluded, and the real end-to-end assertions live in
      # the quality job where ffmpeg runs.
      coverage-ignore-regex: "src/(main|sidecar|symphonia|corpus)\\.rs"
